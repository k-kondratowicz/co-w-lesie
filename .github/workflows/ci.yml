name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cowlesie
        ports:
          - 54322:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # prisma.config.ts reads DATABASE_URL; postinstall runs prisma generate.
      DATABASE_URL: postgresql://postgres:postgres@localhost:54322/cowlesie
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:54322/cowlesie_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:arch
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      # vercel.json skips preview deploys for Dependabot branches (Hobby build quota), so this is the
      # only place their bumps get a production build before auto-merge.
      - run: npm run build
      # Fails a PR that adds or bumps a package with a known advisory; existing dependencies are Dependabot's job.
  
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0