name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      # Only dev tooling and workflow actions merge on their own; the ruleset holds the merge until CI passes.
      # Production dependencies and every major update wait for a human review.
      - name: Queue for merge once CI passes
        if: >-
          steps.metadata.outputs.update-type != 'version-update:semver-major' &&
          (steps.metadata.outputs.dependency-group == 'dev-tooling' || 
            startsWith(github.head_ref, 'dependabot/github_actions/'))
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
